<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>שנה טובה 🤣🌹</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{background:#f3f2f8;color:#202640;overflow-x:hidden}
.shell{width:min(100%,1024px);margin:0 auto;min-height:100vh;background:#fff;overflow:hidden;box-shadow:0 18px 60px rgba(28,24,70,.12)}
.card{position:relative;background:#fff;overflow:hidden}
.hero{position:relative;width:100%;aspect-ratio:2/3;background:#eceaf2;overflow:hidden}
.hero img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
.fact-card{position:absolute;z-index:6;top:6%;right:4.4%;width:43.4%;background:#fff;border-radius:28px;padding:30px 30px 34px;box-shadow:0 14px 36px rgba(34,28,77,.13)}
.lead{display:flex;direction:rtl;align-items:center;justify-content:flex-start;gap:10px;color:#6727d4;font-family:"Arial Black",Arial,sans-serif;font-size:clamp(36px,4.5vw,48px);font-weight:900;line-height:1.03;margin:0 0 24px;text-align:right;white-space:nowrap;letter-spacing:-.5px}
.bulb{font-size:.95em;line-height:1;flex:none}
.fact{font-family:Arial,sans-serif;font-size:clamp(24px,2.75vw,31px);line-height:1.43;font-weight:700;white-space:pre-line;color:#222943;text-align:right}
.lower{position:relative;z-index:8;width:87%;margin:-62% auto 30px;background:#fff;border-radius:34px;padding:14px 18px 26px;box-shadow:0 12px 38px rgba(31,28,75,.14)}
.punch{font-family:Arial,sans-serif;font-size:clamp(23px,2.7vw,31px);line-height:1.45;font-weight:700;white-space:pre-line;text-align:center;color:#202640;background:linear-gradient(135deg,#faf7ff 0%,#f0e7fb 100%);border:0;border-radius:25px;padding:28px 34px}
.divider{display:flex;align-items:center;gap:18px;margin:28px 9% 18px;color:#9498ad}
.divider:before,.divider:after{content:"";height:1px;background:#d7d9e3;flex:1}
.divider span{font-size:30px;line-height:1;color:#9294a8}
.ending{text-align:center;color:#85899d;font-family:Arial,sans-serif;font-size:clamp(19px,2.15vw,24px);line-height:1.5;font-weight:700;padding:0 20px 3px}
.btn{display:block;width:58%;min-width:0;margin:25px auto 4px;border:0;border-radius:29px;padding:18px 24px;background:linear-gradient(135deg,#8536ec 0%,#6826d2 100%);color:#fff;font:900 clamp(24px,2.7vw,31px)/1.07 Arial,sans-serif;cursor:pointer;box-shadow:0 14px 30px rgba(98,32,202,.28)}
.ltr{direction:ltr;display:inline-block}
.brand{position:relative;background:linear-gradient(145deg,#20204a 0%,#2b2d64 100%);color:#fff;text-align:center;padding:54px 18px 60px;border-radius:50% 50% 0 0 / 6.5% 6.5% 0 0}
.brand-name{direction:ltr;color:#9747ec;font-family:"Arial Black",Arial,sans-serif;font-size:clamp(52px,5.8vw,66px);font-weight:900;letter-spacing:-1.5px;line-height:1;margin-bottom:12px}
.brand-line{font-family:Arial,sans-serif;font-size:clamp(18px,1.9vw,23px);line-height:1.45;font-weight:700;color:#f1eff8}
.brand-joke{font-family:Arial,sans-serif;font-size:clamp(14px,1.55vw,18px);line-height:1.45;margin-top:7px;color:#d4d1df}
.brand-joke em{font-style:italic;font-weight:900;color:#fff}
.error{margin:24px;background:#fff;border-radius:24px;padding:30px 22px;text-align:center;font-size:18px;line-height:1.55}
@media(max-width:680px){
 body{background:#fff}.shell{width:100%;box-shadow:none}
 .hero{aspect-ratio:2/3}.hero img{object-position:center top}
 .fact-card{top:4.6%;right:4%;width:44%;padding:18px 15px 20px;border-radius:20px}
 .lead{font-size:clamp(24px,6vw,31px);margin-bottom:14px;gap:5px;letter-spacing:-.2px}
 .fact{font-size:clamp(15px,3.8vw,18.5px);line-height:1.4}
 .lower{width:88%;margin-top:-62%;margin-bottom:20px;padding:12px 12px 18px;border-radius:28px}
 .punch{font-size:clamp(16px,4vw,20px);line-height:1.46;padding:20px 17px;border-radius:20px}
 .divider{margin:20px 8% 14px}.divider span{font-size:23px}
 .ending{font-size:clamp(14px,3.7vw,17px);padding:0 8px}
 .btn{width:70%;font-size:clamp(19px,4.8vw,23px);padding:15px 18px;border-radius:23px;margin-top:18px}
 .brand{padding:36px 14px calc(42px + env(safe-area-inset-bottom));border-radius:50% 50% 0 0 / 5% 5% 0 0}
 .brand-name{font-size:40px}.brand-line{font-size:14px}.brand-joke{font-size:11.5px}
}
</style>
</head>
<body>
<main class="shell" id="app">
  <section class="card" id="card">
    <div class="hero" id="hero"><img id="animalImage" alt=""></div>
    <div class="fact-card">
      <div class="lead"><span class="bulb">💡</span><span>הידעת ש...</span></div>
      <div class="fact" id="fact"></div>
    </div>
    <div class="lower">
      <div class="punch" id="punch"></div>
      <div class="divider"><span>♡</span></div>
      <div class="ending">אה, כן, וכמעט שכחתי...<br>שתהיה לך שנה טובה ומלאה בחיוכים 🤣🌹</div>
      <button class="btn" id="next" type="button"><span class="ltr">Hit me, baby,<br>One more time</span></button>
    </div>
    <footer class="brand">
      <div class="brand-name">I&amp;AI</div>
      <div class="brand-line">גל.בר | מערכות, אוטומציות, תוכן ו-AI</div>
      <div class="brand-joke">(אנחנו עושים <em>גם</em> דברים שאפשר להראות לאמא...)</div>
    </footer>
  </section>
</main>
<script>
const IMAGE_BY_ID=Object.fromEntries(Array.from({length:61},(_,i)=>[i+1,`assets/animals/${String(i+1).padStart(3,"0")}.png`]));
const MASTER=[{"id":1,"title":"סוסון ים","audience":"BOTH","fact":"אצל סוסוני ים, הזכר הוא זה שנושא את העוברים בכיס מיוחד ומביא אותם לעולם.","punch":"משום מה, אחרי שהטבע הוכיח חד-משמעית שאפשר לסדר את זה ככה,\nהמין האנושי החליט:\n\"לאלאלא, בואו נישאר עם השיטה הישנה ונריב על מי מוריד את הזבל\" 😈"},{"id":2,"title":"אקסולוטל","audience":"BOTH","fact":"האקסולוטל מסוגל להצמיח מחדש גפיים שאיבד ולשקם סוגים נוספים של רקמות ואיברים.","punch":"בקיצור, כשמשהו בחיים שלו נהרס, הוא מגדל חדש.\nבני אדם, לעומת זאת, מסוגלים לחזור לאותו אקס בפעם החמישית ולהכריז:\n\"הפעם זה מרגיש אחרת\" 😈"},{"id":3,"title":"צפרדע קפואה","audience":"BOTH","fact":"צפרדע העץ יכולה לשרוד בחורף כשחלק גדול מנוזלי גופה קופא, ואז להפשיר ולחזור לפעילות.","punch":"כלומר,\nהיא יכולה להיות קפואה, לא לזוז ולא להגיב לאף אחד במשך תקופה,\nואז, פתאום, לחזור לתפקד כאילו כלום לא קרה.\nבקיצור,\nכל מי שאי פעם קיבל ממך הודעה ולא ענה שלושה שבועות - מצא עכשיו תירוץ מדעי 😈"},{"id":4,"title":"פלמינגו","audience":"WOMAN","fact":"פלמינגו לא נולד ורוד.\nהצבע הוורוד שלו מתפתח בזכות פיגמנטים מסוג קרוטנואידים שמגיעים מהמזון שלו.","punch":"כלומר, הפלמינגו הוא ההוכחה החיה לכך שתזונה באמת משנה את המראה.\nאבל לפני שאת מזמינה 14 קילו שרימפס,\nלא, זה לא יעבוד עלייך. בדקתי 😈"},{"id":5,"title":"עורב","audience":"WOMAN","fact":"עורבים הם בעלי חיים אינטליגנטיים במיוחד, מסוגלים להשתמש בכלים, ללמוד ולהפיק עשרות סוגים שונים של קולות.","punch":"כלומר, כשהוא יושב על העץ מול הבית וצורח עליך,\nקיימת אפשרות שהוא לא סתם עושה \"קראאא קראאא\".\nיכול להיות שהוא מסביר לכל השכונה בפרטי פרטים\nמה עשית ביום חמישי ב-23:40,\nולמה לדעתו את חתיכת בת יונה 😈"},{"id":6,"title":"עז","audience":"WOMAN","fact":"לעזים יש אישונים מלבניים, והמבנה שלהם מעניק להן שדה ראייה רחב במיוחד.","punch":"מה שאומר שכשהעז מסתכלת ישר קדימה,\nהיא עדיין רואה מצוין מה קורה בצדדים.\nכלומר, כשנדמה לך שהיא לא ראתה אותך מוציאה חתיכת עוגה שלישית מהמקרר ב-01:20 בלילה,\nהיא ראתה.\nוהפרצוף שלה אומר הכול 😈"},{"id":7,"title":"דרקון קומודו","audience":"WOMAN","fact":"לדרקון קומודו יש ארס שפוגע בקרישת הדם, ואם הטרף מצליח לברוח אחרי התקיפה, הוא מסוגל לעקוב אחריו עד שימצא אותו שוב.","punch":"בקיצור:\nהוא נושך אותך,\nאת בורחת,\nוהוא ממשיך לחפש אותך.\nשזה רומנטי מאוד,\nכל עוד מתעלמים מהעובדה\nשהמטרה הסופית היא לאכול אותך.\nמצד שני, יצאנו כבר עם גרועים יותר 😈"},{"id":8,"title":"דולפינה","audience":"BOTH","fact":"לדולפינות נקבות יש דגדגן מפותח, עם רקמת זקפה ומבנה אנטומי שמצביע על תפקיד בהנאה מינית.","punch":"כן.\nאפילו האבולוציה הסתכלה על הדולפינה ואמרה:\n\"לא הכול צריך להיות בשביל רבייה, כפרה.\nקחי משהו לעצמך.\"\nלקח למין האנושי עוד כמה אלפי שנים להגיע למסקנה הזאת,\nוגם עכשיו לא הייתי אומרת שכולם קיבלו את המזכר 😈"},{"id":9,"title":"תולעניים","audience":"WOMAN","fact":"אצל מינים מסוימים של תולעניים, דו-חיים חסרי רגליים, הצאצאים ניזונים ממשכבות עור עשירות בשומן של אמא שלהם.","punch":"כלומר, בפעם הבאה שהילדים מתקשרים ואומרים:\n\"אמא, יש משהו לאכול?\"\nתזכרי:\nזה יכול היה להיות הרבה,\nהרבה יותר גרוע 😈"},{"id":10,"title":"אריה ים","audience":"WOMAN","fact":"השיניים של אריות ים קליפורניים משחירות עם הגיל, אבל לא בגלל ריקבון. השכבה הכהה נוצרת מחיידקים שחיים על השיניים ואף מסייעים להגן עליהן.","punch":"בקיצור, הוא בן 47,\nהשיניים שלו שחורות,\nהוא מסריח מדגים,\nיש לו כרס,\nוהוא שוכב כל היום על החוף וצורח על כל מי שעובר.\nועדיין יש לו בת זוג.\nאז בפעם הבאה שמישהו אומר לך\nשהסטנדרטים שלך גבוהים מדי,\nתראי לו אריה ים 😈"},{"id":11,"title":"הבונובו","audience":"BOTH","fact":"אצל בונובו, סקס משמש לא רק לרבייה אלא גם לפיוס, להפחתת מתח ולניהול קשרים חברתיים.","punch":"כלומר, במקום לשבת שעתיים בסלון ולהגיד\n\"אני לא כועסת, פשוט נפגעתי מהדרך שבה אמרת את זה\",\nהבונובו פשוט משתרללת וממשיכה בחייה.\nמיליוני שנות אבולוציה,\nואיכשהו אנחנו בחרנו בטיפול זוגי 😈"},{"id":12,"title":"נקבת הצבוע","audience":"WOMAN","fact":"לנקבות של צבוע מנומר יש דגדגן מוארך דמוי פין, והן גם ממליטות דרכו.","punch":"אז בפעם הבאה שמישהו אומר לך שנשים מגזימות עם כאבי לידה,\nאת רשאית לבעוט לו בביצים לצורכי המחשה מדעית 😈"},{"id":13,"title":"הפילה","audience":"BOTH","fact":"היריון של פילה נמשך כמעט שנתיים, בערך 22 חודשים.","punch":"22 חודשים.\nתשעה חודשים פנימה היא מסתכלת על אישה אנושית עם תינוק ואומרת:\n\"מה זאת אומרת ילדת??\nרק עכשיו התחלנו, בת יונה.\"\nואז היא רואה אותה נכנסת שוב להיריון שנה אחר כך ואומרת:\n\"אה. אז את סתומה.\" 😈"},{"id":14,"title":"המלכה העירומה","audience":"BOTH","fact":"אצל חולד עירום, בדרך כלל רק נקבה אחת במושבה מתרבה. היא המלכה.","punch":"עשרות יצורים גרים איתה בבית,\nכולם עובדים,\nורק היא משתרללת.\nזו לא מושבה.\nזה קיבוץ בשנות ה-70 😈"},{"id":15,"title":"הלביאה","audience":"BOTH","fact":"בלהקת אריות, הלביאות מבצעות חלק גדול מהציד.","punch":"היא רצה.\nהיא צדה.\nהיא הורגת.\nהיא גוררת את האוכל הביתה.\nהוא שוכב בצל עם רעמה מהממת ואומר:\n\"את יודעת מה היית צריכה לעשות?\"\nהטבע המציא בעלים הרבה לפנינו 😈"},{"id":16,"title":"נקבת הגמל שלמה","audience":"BOTH","fact":"אצל מינים מסוימים של גמל שלמה, הנקבה עשויה לאכול את הזכר במהלך ההזדווגות או אחריה.","punch":"המדע קורא לזה \"קניבליזם מיני\".\nאני קוראת לזה:\n\"אמרתי לך לא לשאול אותי אם גמרתי\" 😈"},{"id":17,"title":"אורקה וסבתא","audience":"BOTH","fact":"נקבות אורקה הן בין בעלי החיים המעטים שעוברות גיל מעבר ויכולות לחיות עוד עשרות שנים אחריו.","punch":"כלומר, הטבע הסתכל על אישה בת 50 ואמר:\n\"סיימת עם ילדים. עכשיו לכי תחיי.\"\nואז הגיע משה ושאל:\n\"נו, והילדים?\"\nתמות, משה 😈"},{"id":18,"title":"ברווזה","audience":"BOTH","fact":"אצל ברווזים התפתחו איברי רבייה מורכבים אצל שני המינים, כחלק ממאבק אבולוציוני סביב שליטה בהפריה.","punch":"במילים אחרות, נקבות ברווז פיתחו מנגנונים אבולוציוניים שלמים\nכדי להתמודד עם זכרים שלא מבינים רמזים.\nואנחנו פשוט צריכות \"להיות יותר ברורות\" 😈"},{"id":19,"title":"נקבת התמנון","audience":"BOTH","fact":"אצל מיני תמנונים רבים, הנקבה שומרת על הביצים, מפסיקה לאכול ובסופו של דבר מתה לאחר בקיעתן.","punch":"היריון.\nילדים.\nלא אוכלת.\nמתה.\nואז מישהו נכנס הביתה ושואל:\n\"אבל למה הבית נראה ככה?\" 😈"},{"id":20,"title":"אלבטרוסים","audience":"BOTH","fact":"אצל אלבטרוס לייסן תועדו זוגות של שתי נקבות שמגדלות יחד אפרוח.","punch":"שתי נשים.\nבית אחד.\nילד.\nואף גבר לא עומד באמצע המטבח ושואל איפה המספריים\nכשהם מול הפרצוף שלו.\nלפעמים המדע מביא איתו תקווה 😈"},{"id":21,"title":"דבורת המלכה","audience":"BOTH","fact":"מלכת דבורים מזדווגת עם כמה זכרים במהלך מעופי כלולות ויכולה לאגור זרע בגופה במשך שנים.","punch":"סיבוב אחד.\nמספיק חומר לשנים.\nחוזרת לנהל ממלכה.\nבלי \"בוקר טוב יפה שלי 🌹\" למחרת בבוקר.\nיעילה. ממוקדת. מלכה. 😈"},{"id":22,"title":"פינגווינית עם אבנים","audience":"BOTH","fact":"אצל מיני פינגווינים מסוימים, אבנים חשובות לבניית הקן וזכרים אוספים ומביאים אותן במהלך החיזור.","punch":"הוא מביא לה אבן.\nוהיא מתרשמת.\nואז הגיע האדם, שם את האבן על טבעת,\nלקח שלוש משכורות\nוהוסיף:\n\"זה יהלום מעבדה או שאת לא באמת אוהבת אותי?\" 😈"},{"id":23,"title":"פילת המטריארך","audience":"WOMAN","fact":"עדרי פילים משפחתיים מונהגים בדרך כלל על ידי נקבה מבוגרת ומנוסה, המטריארכית.","punch":"כשצריך להחליט לאן הולכים,\nאיפה יש מים\nוממה צריך להיזהר,\nכולם מקשיבים לאישה המבוגרת.\nהמין האנושי ניסה שיטה אחרת.\nתסתכלי סביב ותגידי לי איך הולך לנו 😈"},{"id":24,"title":"שפירית","audience":"BOTH","fact":"אצל מין מסוים של שפירית תועדו נקבות שנופלות לקרקע ומעמידות פני מתות כדי להימנע מזכרים עקשנים.","punch":"היא שוכבת על הרצפה.\nלא זזה.\nמעמידה פני גופה.\nועדיין, איפשהו יש גבר שחושב:\n\"אולי היא פשוט משחקת אותה קשה להשגה.\" 😈"},{"id":25,"title":"לטאה בלי גברים","audience":"BOTH","fact":"יש מינים של לטאות שוטטייל שבהם כל הפרטים נקבות, והן מתרבות ללא זכרים בתהליך של רביית בתולים.","punch":"מין שלם של נשים שמתרבות בלי גברים.\nשרדו.\nמתפקדות.\nוהמדף כנראה תלוי ישר 😈"},{"id":26,"title":"תרנגולת","audience":"BOTH","fact":"תרנגולת יכולה לאגור זרע בגופה במשך שבועות ולהפרות ביצים מאוחר יותר.","punch":"שבועות.\nבלי דייט נוסף.\nבלי \"מה אנחנו?\"\nבלי \"ערה?\" ב-01:17.\nובלי לראות אותו שוב לעולם.\nהתרנגולת הפכה סטוץ לתוכנית חיסכון 😈"},{"id":27,"title":"עכבישת טווס","audience":"WOMAN","fact":"זכרי עכביש טווס מבצעים ריקוד חיזור מורכב ומציגים צבעים מרהיבים כדי להרשים נקבות.","punch":"הוא רוקד.\nמנפנף.\nמשקיע.\nנותן את הנשמה.\nוהיא מסתכלת ואומרת:\n\"לא יודעת...\nהוא ממש חמוד,\nאבל אין לי פרפרים.\"\nגברת.\nהוא עכביש.\nמה רצית שיהיו לך?! 😈"},{"id":28,"title":"נמלת המלכה","audience":"BOTH","fact":"מלכות של מיני נמלים מסוימים יכולות לחיות שנים רבות, הרבה יותר מהפועלות שסביבן.","punch":"כולם עובדים.\nכולם מביאים לה אוכל.\nכולם מטפלים בבית.\nהיא יושבת באמצע ומשריצה.\nופתאום \"מלכה\" באינסטגרם עם קוד קופון ל-SHEIN\nנשמע קצת פחות מרשים 😈"},{"id":29,"title":"נקבת הכריש","audience":"BOTH","fact":"אצל כמה מיני כרישים תועדה רביית בתולים, שבה נקבה מייצרת צאצאים ללא הפריה מזכר.","punch":"היא הסתכלה על שוק הדייטינג ואמרה:\n\"יודעים מה? עזבו. אני אסתדר.\" 😈"},{"id":30,"title":"המקוקית","audience":"WOMAN","fact":"נקבות מקוק יפני נצפו רוחצות במעיינות חמים, בין היתר כדי להתמודד עם הקור.","punch":"שלג בחוץ.\nמים חמים.\nאף אחד לא מדבר איתך.\nאף אחד לא צריך ממך כלום.\nסוף סוף חיה שהבינה מה זה \"שנה טובה\" 😈"},{"id":31,"title":"וומבט","audience":"BOTH","fact":"וומבטים מחרבנים קוביות.\nממש קוביות, עם צלעות ופינות.","punch":"מדענים אשכרה חקרו במשך שנים איך הם עושים את זה.\nמה שמוכיח שגם אם נדמה לך שהעבודה שלך מיותרת,\nיש מישהו שקיבל תקציב כדי לחקור תחת של וומבט 😈"},{"id":32,"title":"תמנון","audience":"BOTH","fact":"לתמנון יש שלושה לבבות ודם כחול.\nשניים מהלבבות מזרימים דם דרך הזימים והשלישי לשאר הגוף.","punch":"שלושה לבבות!!!\nועדיין, איכשהו, בני אדם עם לב אחד מצליחים לשבור אותו לשלושה אנשים במקביל.\nהטבע באמת לא חשב על הכול 😈"},{"id":33,"title":"עצלן","audience":"BOTH","fact":"עצלנים זזים כל כך לאט, שעל הפרווה שלהם גדלות אצות.\nהפרווה שלהם אפילו בנויה באופן שמסייע לאצות להתבסס עליה.","punch":"כלומר, היצור הזה התעצל כל כך הרבה זמן,\nעד שבשלב מסוים הטבע פשוט אמר:\n\"טוב, אם אתה כבר לא זז, לפחות נעשה ממך עציץ\" 😈"},{"id":34,"title":"ברווזן","audience":"BOTH","fact":"הברווזן הוא יונק שמטיל ביצים, ולמקור שלו יש קולטנים שמאפשרים לו לחוש אותות חשמליים שמייצר הטרף שלו.","punch":"יונק. מטיל ביצים. מקור של ברווז. זנב של בונה. מזהה חשמל.\nבקיצור, הברווזן הוא מה שקורה כשאלוהים מגלה ביום האחרון לבריאה שנשארו לו חלקי חילוף 😈"},{"id":35,"title":"נרוואל","audience":"BOTH","fact":"ה\"קרן\" הענקית שיוצאת מראשו של הנרוואל היא בכלל שן שהתארכה בצורה קיצונית.","punch":"כלומר, מתישהו האבולוציה הסתכלה על לווייתן ואמרה:\n\"חמוד, אבל חסר לי משהו.\"\nואז תקעה לו שן של שני מטר באמצע הפרצוף והלכה לאכול צהריים 😈"},{"id":36,"title":"מדוזה","audience":"BOTH","fact":"יש מדוזה בשם Turritopsis dohrnii שמסוגלת, בתנאים מסוימים, לחזור מהשלב הבוגר לשלב מוקדם יותר במחזור החיים שלה ולהתחיל את ההתפתחות מחדש.","punch":"כלומר, כשהחיים נהיים קשים היא פשוט חוזרת להיות צעירה ומתחילה מחדש.\nבלי בוטוקס.\nבלי חדר כושר.\nבלי לקנות אופנוע בגיל 52 ולהסביר לכולם ש\"תמיד אהבתי את החופש\" 😈"},{"id":37,"title":"אלמנה","audience":"BOTH","fact":"אצל מין מסוים של אלמנה שחורה, הזכר ממש מכניס את עצמו ללסתות של הנקבה במהלך ההזדווגות, ואם היא דוחה אותו, הוא עשוי לנסות שוב עד שהיא אוכלת אותו.","punch":"המחקר לא בדק אם לפני כן היא אמרה לו 17 פעם:\n\"אני לא רעבה, תזמין רק לעצמך\",\nואז אכלה לו גם את הצ'יפס 😈"},{"id":38,"title":"ציפור טפילית","audience":"BOTH","fact":"יש ציפורים שמטילות את הביצים שלהן בקינים של ציפורים אחרות, ומשאירות להן לגדל את הגוזלים במקומן.","punch":"כלומר, מסתבר שהרעיון:\n\"מאמי, יש לי שני ילדים ממערכת יחסים קודמת, אבל האבא ממש בתמונה\"\nקיים בטבע כבר מיליוני שנים.\nרק בלי המזונות והדיונים אצל העובדת הסוציאלית 😈"},{"id":39,"title":"סוסון ים, הגרסה הפרועה","audience":"BOTH","fact":"אצל סוסוני ים הזכר הוא שנושא את ההיריון וממליט את הצאצאים.","punch":"למרבה הצער, המחקר לא בדק אם מיד אחרי הלידה הנקבה שאלה אותו:\n\"נו, מתי חוזרים לעשות סקס?\"\nוהוא הסתכל עליה עם 1,400 תינוקות מסביב ואמר:\n\"אם הדבר הזה מתקרב אליי עוד פעם,\nאני מזמין משטרה\" 😈"},{"id":40,"title":"חנקן","audience":"WOMAN","fact":"החנקן הוא ציפור קטנה שנוהגת לשפד את הטרף שלה על קוצים או על גדר תיל, ולחזור לאכול אותו אחר כך.","punch":"שזה נשמע מזעזע,\nעד שאת מגלה שהוא אמר לה:\n\"את בדיוק כמו אמא שלך\".\nמשם והלאה אנחנו לא שופטים אף אחד 😈"},{"id":41,"title":"דבור זכר","audience":"BOTH","fact":"דבור זכר שמזדווג עם המלכה מת זמן קצר לאחר מכן, וחלק מאיבר הרבייה שלו נשאר בגופה.","punch":"סקס עם מלכה.\nמת.\nהפין נשאר מאחור.\nגם בטבע יש גברים שלא יודעים מתי הגיע הזמן ללכת הביתה 😈"},{"id":42,"title":"גמל שלמה","audience":"MAN","fact":"אצל מינים מסוימים של גמל שלמה, הנקבה עשויה לאכול את הזכר במהלך ההזדווגות או אחריה.","punch":"חשבת שהיה לך דייט גרוע כי היא הזמינה מנה ראשונה, עיקרית וקינוח\nולא הציעה להתחלק בחשבון?\nאחי.\nחזרת הביתה.\nתגיד תודה 😈"},{"id":43,"title":"עכביש","audience":"MAN","fact":"אצל מיני עכבישים מסוימים הזכר מביא לנקבה טרף עטוף במשי כמתנת חיזור.","punch":"הוא צד ארוחת ערב.\nאורז אותה יפה.\nומביא אותה לדייט.\nואתה עומד מולה מול מקרר מלא ואומר:\n\"לא יודע, מאמי, מה שבא לך.\"\nאתה מפסיד לעכביש, אחי 😈"},{"id":44,"title":"אריה","audience":"BOTH","fact":"אריות יכולים לנוח ולישון בערך 20 שעות ביממה.","punch":"ישן.\nאוכל בשר שמישהו אחר צד.\nמזדווג.\nישן שוב.\nועדיין קוראים לו \"מלך החיות\".\nיחסי ציבור, רבותיי.\nהכול יחסי ציבור 😈"},{"id":45,"title":"זכר דג החכאי","audience":"MAN","fact":"אצל כמה מיני דגי חכאי במעמקי הים, הזכר הקטן נצמד לנקבה ומתאחה איתה פיזית, עד שהוא הופך למעשה למקור זרע קבוע בגופה.","punch":"הוא פגש אישה פעם אחת\nומאז מחובר אליה פיזית לכל החיים.\nאז בפעם הבאה שהיא אומרת לך\n\"אני צריכה יותר מחויבות\",\nתשאל אותה כמה יותר 😈"},{"id":46,"title":"עכבר כיס","audience":"MAN","fact":"אצל עכברי כיס מהסוג Antechinus, הזכרים נכנסים בעונת הרבייה לתקופת הזדווגות אינטנסיבית כל כך, שהעומס הפיזיולוגי תורם לקריסת מערכת החיסון ולמותם.","punch":"הם מזדווגים עד שהם מתים.\nלא.\nאתה עדיין צריך לקום מחר לעבודה 😈"},{"id":47,"title":"דג הנפוח","audience":"MAN","fact":"זכר של מין מסוים של דג נפוח יוצר בקרקעית הים מבנה עגול ומורכב בחול כדי למשוך נקבה.","punch":"היצור הקטן בונה יצירת אמנות ענקית בקרקעית הים\nרק כדי שמישהי תסכים להזדווג איתו.\nואתה שלחת:\n\"היי\"\nוחיכית.\nואז:\n\"??\"\nכן.\nמוזר שהיא לא ענתה 😈"},{"id":48,"title":"טווס","audience":"MAN","fact":"זכר הטווס מציג זנב גדול וצבעוני כדי להרשים נקבות.","punch":"אביזר עצום, מוגזם וצבעוני\nשכל המטרה שלו היא לגרום לנשים להסתכל.\nואתה קנית את הג'יפ כי\n\"צריך מרווח גחון\" 😈"},{"id":49,"title":"גורילה","audience":"BOTH","fact":"זכר גורילה בוגר מסוג Silverback עשוי להנהיג קבוצה שכוללת כמה נקבות וצאצאים רבים.","punch":"כמה נשים.\nהמון ילדים.\nכולם רוצים ממנו משהו.\n\"זכר אלפא\" נשמע מרשים\nעד שמבינים שזה בעצם יום שישי בסופר 😈"},{"id":50,"title":"אייל","audience":"BOTH","fact":"בעונת הרבייה, זכרים של מיני איילים משתמשים בקרניים כדי להילחם ביריבים ולהתחרות על נקבות.","punch":"שני גברים עם דברים ענקיים שבולטים להם מהראש\nנכנסים אחד בשני בכל הכוח\nכדי להרשים אישה.\nמיליוני שנות אבולוציה.\nואז המצאנו BMW 😈"},{"id":51,"title":"עז זכר","audience":"MAN","fact":"בעונת הרבייה, תיישים זכרים משתינים על הפנים, הזקן והרגליים הקדמיות שלהם, והריח מושך נקבות.","punch":"אז בפעם הבאה שאתה עומד מול המדף ומתלבט בין שני בשמים,\nתירגע.\nבטבע הרף הרבה יותר נמוך 😈"},{"id":52,"title":"קנגורו","audience":"BOTH","fact":"זכרי קנגורו מפגינים שרירים ומתחרים פיזית זה בזה על גישה לנקבות.","punch":"עומד.\nמנפח שרירים.\nמחפש גבר אחר לריב איתו.\nכלומר, יום חמישי ב-01:30\nמחוץ לכל מועדון בעולם 😈"},{"id":53,"title":"ציפור הסוכי","audience":"MAN","fact":"זכרי ציפורי סוכי בונים ומקשטים מבנה חיזור בחפצים צבעוניים כדי למשוך נקבות.","punch":"הוא מסדר את הבית\nומשקיע בעיצוב\nכדי שאישה תרצה להיכנס.\nתן לזה לחלחל רגע.\nאני אחכה 😈"},{"id":54,"title":"פיל ים","audience":"BOTH","fact":"זכר פיל ים דרומי יכול לשקול כמה טונות ולהיות גדול בהרבה מהנקבות, וזכרים דומיננטיים עשויים להחזיק הרמון של נקבות.","punch":"כמה טונות.\nאין צוואר.\nשוכב על החוף.\nעושה קולות מזעזעים.\nועדיין יש לו הרמון.\nאז אולי באמת האישיות חשובה 😈"},{"id":55,"title":"פינגווין","audience":"BOTH","fact":"אצל פינגווין קיסרי, הזכר דוגר על הביצה במשך יותר מחודשיים בזמן שהנקבה יוצאת לים כדי לאכול.","punch":"היא נוסעת לחודשיים.\nהוא נשאר עם הילד.\nואפילו פעם אחת לא אומר:\n\"עשיתי לך בייביסיטר\".\nהאבולוציה הקדימה אותנו 😈"},{"id":56,"title":"זבוב עקרב","audience":"BOTH","fact":"אצל מינים מסוימים של זבובי עקרב, הזכר נותן לנקבה מתנת מזון, וגודל המתנה יכול להשפיע על משך ההזדווגות.","punch":"סוף סוף מחקר שמוכיח מדעית:\nגודל כן קובע.\nשל הסנדוויץ', יא סוטה 😈"},{"id":57,"title":"צפרדע","audience":"BOTH","fact":"א
