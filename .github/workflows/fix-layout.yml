name: "Match approved greeting card reference"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild approved card proportions
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.index('<style>')
          b=s.index('</style>')+len('</style>')
          css=r'''<style>
          *{box-sizing:border-box}
          html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
          body{margin:0;background:#f4f3f8;color:#17172a;overflow-x:hidden}
          .shell{width:min(100%,1024px);margin:0 auto;background:#fff;min-height:100vh;overflow:hidden;box-shadow:0 18px 60px rgba(25,21,63,.10)}
          .card{position:relative;background:#fff;overflow:hidden;padding-bottom:0}
          .hero{position:relative;width:100%;height:min(76vw,780px);background:#eceaf2;overflow:hidden}
          .hero img{width:100%;height:100%;display:block;object-fit:cover;object-position:center center;transition:opacity .18s ease}
          .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.02) 0%,rgba(255,255,255,0) 72%,rgba(255,255,255,.08) 100%);pointer-events:none}
          .fact-card{position:absolute;z-index:5;top:6%;right:4.4%;width:43.5%;max-width:445px;background:rgba(255,255,255,.97);border-radius:31px;padding:36px 34px 38px;box-shadow:0 16px 42px rgba(34,28,77,.16)}
          .lead{display:flex;direction:rtl;align-items:center;justify-content:flex-start;gap:10px;color:#6727d4;font-size:clamp(34px,4.3vw,46px);font-weight:900;line-height:1;margin:0 0 28px;white-space:nowrap;letter-spacing:-.7px}
          .bulb{font-size:.95em;line-height:1;flex:none}
          .fact{font-size:clamp(23px,2.7vw,31px);line-height:1.42;font-weight:700;white-space:pre-line;color:#22253d;text-align:right}
          .lower{position:relative;z-index:8;width:87%;margin:-10.5% auto 0;background:#fff;border-radius:34px;padding:34px 28px 24px;box-shadow:0 -10px 34px rgba(31,28,75,.12)}
          .dots{font-size:20px;line-height:.92;font-weight:900;color:#7833e9;text-align:center;margin:0 0 18px}
          .punch{font-size:clamp(22px,2.55vw,29px);line-height:1.47;font-weight:700;white-space:pre-line;text-align:center;color:#21233b;background:linear-gradient(135deg,#fbf8ff 0%,#f1e9fd 100%);border:1px solid #e2d4f8;border-radius:26px;padding:28px 30px;box-shadow:inset 5px 0 0 #b98bf5}
          .divider{display:flex;align-items:center;gap:18px;margin:25px 38px 17px;color:#9698aa}
          .divider:before,.divider:after{content:"";height:1px;background:#d6d8e2;flex:1}
          .divider span{font-size:27px;line-height:1;color:#9294a8}
          .ending{text-align:center;color:#7a7c8f;font-size:clamp(18px,2.1vw,24px);line-height:1.5;font-weight:700;padding:0 18px 2px}
          .btn{display:block;width:52%;min-width:420px;margin:22px auto 34px;border:0;border-radius:28px;padding:18px 24px;background:linear-gradient(135deg,#8738ef 0%,#6320cc 100%);color:#fff;font:900 clamp(24px,2.65vw,31px)/1.08 Arial,sans-serif;cursor:pointer;box-shadow:0 14px 30px rgba(98,32,202,.30)}
          .ltr{direction:ltr;display:inline-block}
          .brand{background:linear-gradient(145deg,#20204a 0%,#2a2c63 100%);color:#fff;text-align:center;padding:52px 18px 58px;border-radius:50% 50% 0 0 / 7% 7% 0 0}
          .brand-name{direction:ltr;color:#9747ec;font-size:clamp(48px,5.7vw,62px);font-weight:900;letter-spacing:-1.5px;line-height:1;margin-bottom:12px}
          .brand-line{font-size:clamp(17px,1.85vw,22px);line-height:1.45;font-weight:700;color:#f1eff8}
          .brand-joke{font-size:clamp(14px,1.5vw,18px);line-height:1.45;margin-top:7px;color:#d3d0df}
          .brand-joke em{font-style:italic;font-weight:900;color:#fff}
          .error{margin:24px;background:#fff;border-radius:24px;padding:30px 22px;text-align:center;font-size:18px;line-height:1.55}
          @media(max-width:680px){
            body{background:#fff}
            .shell{width:100%;box-shadow:none}
            .hero{height:78vw;min-height:500px;max-height:660px}
            .fact-card{top:4.8%;right:4.5%;width:46%;padding:22px 18px 24px;border-radius:22px}
            .lead{font-size:clamp(25px,6vw,34px);margin-bottom:18px;gap:6px}
            .fact{font-size:clamp(16px,4.15vw,21px);line-height:1.42}
            .lower{width:88%;margin-top:-10%;padding:22px 15px 16px;border-radius:27px}
            .dots{font-size:16px;margin-bottom:13px}
            .punch{font-size:clamp(16px,4vw,20px);line-height:1.48;padding:19px 16px;border-radius:20px}
            .divider{margin:19px 15px 13px}
            .ending{font-size:clamp(14px,3.7vw,17px);padding:0 6px}
            .btn{width:74%;min-width:0;font-size:clamp(19px,4.7vw,23px);padding:15px 18px;border-radius:22px;margin:17px auto 26px}
            .brand{padding:34px 14px calc(40px + env(safe-area-inset-bottom));border-radius:50% 50% 0 0 / 6% 6% 0 0}
            .brand-name{font-size:38px}
            .brand-line{font-size:14px}
            .brand-joke{font-size:11.5px}
          }
          </style>'''
          s=s[:a]+css+s[b:]
          p.write_text(s,encoding='utf-8')
      - name: Commit approved layout
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Match approved reference composition"
          git pull --rebase origin main
          git push origin main
