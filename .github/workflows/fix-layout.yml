name: "Apply dynamic I&AI design"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dynamic purple accent UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.index('<style>')
          b=s.index('</style>')+len('</style>')
          css='''<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}body{position:relative;overflow-x:hidden;background:radial-gradient(circle at 12% 4%,rgba(139,92,246,.13),transparent 28%),radial-gradient(circle at 92% 34%,rgba(109,40,217,.08),transparent 25%),#f7f7fb;color:#171525;display:flex;justify-content:center;padding:22px 14px 34px}.wrap{position:relative;width:min(100%,580px);display:flex;flex-direction:column;gap:15px}.card{position:relative;overflow:hidden;background:rgba(255,255,255,.96);border:1px solid rgba(104,71,160,.13);border-radius:28px;padding:29px 27px 25px;box-shadow:0 20px 55px rgba(38,27,72,.11)}.card:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(124,58,237,.07);left:-80px;top:-78px}.lead{position:relative;display:inline-block;font-size:29px;font-weight:800;margin:0 0 22px;color:#6d28d9;letter-spacing:-.4px}.lead:after{content:"";position:absolute;right:0;bottom:-7px;width:54px;height:4px;border-radius:99px;background:linear-gradient(90deg,#8b5cf6,#c4b5fd)}.fact,.punch,.ending{position:relative;white-space:pre-line}.fact{font-size:21px;line-height:1.55;font-weight:700;color:#1e1b2e}.dots{position:relative;font-size:18px;line-height:1.02;margin:15px 0;color:#8b5cf6;font-weight:800}.punch{font-size:20px;line-height:1.55;font-weight:600;margin:0 0 23px;padding:18px 19px;background:linear-gradient(135deg,rgba(139,92,246,.105),rgba(196,181,253,.17));border:1px solid rgba(124,58,237,.12);border-radius:18px;color:#2b2141;box-shadow:inset 4px 0 0 rgba(124,58,237,.48)}.ending{padding-top:4px;font-size:19px;line-height:1.5;font-weight:700;color:#302747}.btn{position:relative;overflow:hidden;width:100%;border:0;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;font-family:Arial,sans-serif;font-size:20px;font-weight:800;line-height:1.12;padding:16px 18px;cursor:pointer;box-shadow:0 11px 26px rgba(91,33,182,.25);transition:transform .16s ease,box-shadow .16s ease}.btn:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.18) 48%,transparent 70%);transform:translateX(120%);transition:transform .55s ease}.btn:hover{transform:translateY(-2px);box-shadow:0 14px 31px rgba(91,33,182,.31)}.btn:hover:before{transform:translateX(-120%)}.btn:active{transform:translateY(1px)}.brand{direction:rtl;text-align:center;padding:10px 8px 2px;color:#8b8796}.brand-name{direction:ltr;font-size:30px;line-height:1;font-weight:900;letter-spacing:-1.2px;color:#7c3aed;margin-bottom:7px}.brand-line{font-size:13px;line-height:1.45;font-weight:600;color:#716d7b}.brand-joke{font-size:11px;line-height:1.45;margin-top:3px;color:#9b97a4}.error{font-size:19px;line-height:1.55;text-align:center;padding:50px 8px}.ltr{direction:ltr;display:inline-block}@keyframes greetingIn{0%{opacity:.35;transform:translateY(7px) scale(.995)}100%{opacity:1;transform:none}}.card.fresh{animation:greetingIn .28s ease-out}@media(max-width:420px){body{padding:12px 10px 24px}.wrap{gap:12px}.card{border-radius:23px;padding:24px 20px 21px}.lead{font-size:27px;margin-bottom:19px}.fact{font-size:19px;line-height:1.52}.punch{font-size:18px;line-height:1.52;padding:16px 15px;margin-bottom:20px}.ending{font-size:18px}.btn{font-size:19px;border-radius:17px;padding:15px 16px}.brand-name{font-size:28px}.brand-line{font-size:12px}.brand-joke{font-size:10.5px}}</style>'''
          s=s[:a]+css+s[b:]
          old='</section><button class="btn" id="next"><span class="ltr">Hit me, baby,<br>One more time</span></button></main>'
          new='</section><button class="btn" id="next"><span class="ltr">Hit me, baby,<br>One more time</span></button><footer class="brand"><div class="brand-name">I&amp;AI</div><div class="brand-line">גל.בר | מערכות, אוטומציות, תוכן ו-AI</div><div class="brand-joke">(אנחנו עושים גם דברים שאפשר להראות לאמא...)</div></footer></main>'
          if '<footer class="brand">' not in s:
              s=s.replace(old,new)
          marker='punch.textContent="<"+item.punch.replace(/\\n{2,}/g,"\\n")+">";'
          if 'card.classList.remove("fresh")' not in s and marker in s:
              s=s.replace(marker,marker+'card.classList.remove("fresh");void card.offsetWidth;card.classList.add("fresh");')
          p.write_text(s,encoding='utf-8')
      - name: Commit design
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Launch dynamic purple accent I&AI design"
          git pull --rebase origin main
          git push origin main
