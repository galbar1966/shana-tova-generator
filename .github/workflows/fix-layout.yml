name: "Match approved greeting card reference"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild approved card proportions
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.index('<style>')
          b=s.index('</style>')+len('</style>')
          css=r'''<style>
          *{box-sizing:border-box}
          html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
          body{background:#f3f2f8;color:#17172a;overflow-x:hidden}
          .shell{width:min(100%,760px);margin:0 auto;min-height:100vh;background:#fff;overflow:hidden;box-shadow:0 18px 55px rgba(31,28,75,.10)}
          .card{position:relative;background:#fff;overflow:hidden}
          .hero{position:relative;width:100%;height:min(86.5vw,657px);min-height:0;background:#e7e5ee;overflow:hidden}
          .hero img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block;transition:opacity .18s ease}
          .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 72%,rgba(255,255,255,.08) 100%);pointer-events:none}
          .fact-card{position:absolute;z-index:5;top:6.2%;right:4.8%;width:43.4%;max-width:330px;background:rgba(255,255,255,.97);border-radius:26px;padding:27px 24px 26px;box-shadow:0 15px 35px rgba(31,28,75,.14)}
          .lead{display:flex;direction:rtl;align-items:center;justify-content:flex-start;gap:8px;color:#6727d4;font-size:clamp(28px,4.4vw,35px);font-weight:900;line-height:1;margin:0 0 24px;white-space:nowrap;letter-spacing:-.5px}
          .bulb{font-size:.95em;line-height:1;flex:none}
          .fact{font-size:clamp(18px,2.85vw,22px);line-height:1.48;font-weight:700;white-space:pre-line;color:#202139;text-align:right}
          .lower{position:relative;z-index:7;width:86.4%;margin:-11.5% auto 0;background:#fff;border-radius:29px 29px 0 0;padding:18px 18px 10px;box-shadow:0 -8px 30px rgba(31,28,75,.10)}
          .dots{font-size:18px;line-height:.96;font-weight:900;color:#7a32e8;text-align:center;margin:0 0 14px}
          .punch{font-size:clamp(18px,2.75vw,21px);line-height:1.52;font-weight:700;white-space:pre-line;text-align:center;color:#22223a;background:linear-gradient(135deg,#faf7ff,#f1e9fd);border:1px solid #e3d6f7;border-radius:22px;padding:22px 22px;box-shadow:inset 4px 0 0 #b586f3}
          .divider{display:flex;align-items:center;gap:14px;margin:21px 22px 14px;color:#9698aa}
          .divider:before,.divider:after{content:"";height:1px;background:#d8d9e3;flex:1}
          .divider span{font-size:25px;line-height:1;color:#9294a8}
          .ending{text-align:center;color:#77798c;font-size:clamp(16px,2.45vw,19px);line-height:1.48;font-weight:700;padding:0 10px 10px}
          .btn{display:block;width:86.4%;margin:14px auto 23px;border:0;border-radius:24px;padding:17px 18px;background:linear-gradient(135deg,#7d35ef,#6120ca);color:#fff;font:900 clamp(19px,2.8vw,22px)/1.07 Arial,sans-serif;cursor:pointer;box-shadow:0 13px 28px rgba(98,32,202,.28)}
          .ltr{direction:ltr;display:inline-block}
          .brand{background:linear-gradient(145deg,#22214e,#292b62);color:#fff;text-align:center;padding:34px 16px 38px;border-radius:50% 50% 0 0 / 8% 8% 0 0}
          .brand-name{direction:ltr;color:#9747ec;font-size:clamp(36px,5.5vw,43px);font-weight:900;letter-spacing:-1.3px;line-height:1;margin-bottom:10px}
          .brand-line{font-size:clamp(13px,2vw,15px);line-height:1.45;font-weight:700;color:#f1eff8}
          .brand-joke{font-size:clamp(11px,1.65vw,13px);line-height:1.45;margin-top:5px;color:#d3d0df}
          .brand-joke em{font-style:italic;font-weight:900;color:#fff}
          .error{margin:24px;background:#fff;border-radius:24px;padding:30px 22px;text-align:center;font-size:18px;line-height:1.55}
          @media(max-width:520px){
            .shell{width:100%;box-shadow:none}
            .hero{height:86.5vw}
            .fact-card{top:5.7%;right:4.5%;width:44%;padding:20px 17px 19px;border-radius:22px}
            .lead{font-size:clamp(24px,6.3vw,29px);margin-bottom:17px;gap:6px}
            .fact{font-size:clamp(15.5px,4.15vw,18px);line-height:1.44}
            .lower{width:86.5%;margin-top:-11.5%;padding:15px 13px 8px;border-radius:25px 25px 0 0}
            .dots{font-size:16px;margin-bottom:12px}
            .punch{font-size:clamp(16px,4.05vw,18px);line-height:1.47;padding:18px 15px;border-radius:19px}
            .divider{margin:18px 16px 12px}
            .ending{font-size:clamp(14.5px,3.8vw,16.5px);padding-bottom:7px}
            .btn{width:86.5%;font-size:clamp(18px,4.7vw,20px);padding:15px 16px;border-radius:21px;margin-top:13px;margin-bottom:20px}
            .brand{padding:29px 14px calc(33px + env(safe-area-inset-bottom));border-radius:50% 50% 0 0 / 7% 7% 0 0}
            .brand-name{font-size:35px}
          }
          </style>'''
          s=s[:a]+css+s[b:]
          p.write_text(s,encoding='utf-8')
      - name: Commit approved layout
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild card to approved proportions"
          git pull --rebase origin main
          git push origin main
