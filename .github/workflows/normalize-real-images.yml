name: Apply approved reference layout

on:
  push:
    paths:
      - '.github/workflows/normalize-real-images.yml'
      - '.github/scripts/add_social_preview.py'
      - '.github/scripts/rebalance_text_hierarchy.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add social preview metadata
        run: python .github/scripts/add_social_preview.py
      - name: Rebalance fact and punch hierarchy
        run: python .github/scripts/rebalance_text_hierarchy.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Rebalance fact and punch hierarchy"
            git push
          fi
