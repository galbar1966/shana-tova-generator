name: Apply approved reference layout

on:
  push:
    paths:
      - '.github/workflows/normalize-real-images.yml'
      - '.github/scripts/apply_reference.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixed reference geometry
        run: python .github/scripts/apply_reference.py
      - name: Commit layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply fixed 2:3 approved reference geometry"
            git push
          fi
