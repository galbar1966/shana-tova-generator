name: Normalize real animal images

on:
  push:
    paths:
      - '.github/workflows/normalize-real-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix hero rendering and approved reference details
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The previous draw() stopped before assigning the image src because it
          # referenced non-existent visual / visualTitle elements. Remove those refs.
          broken = 'visual.classList.remove("loaded");visualTitle.textContent=item.title;animalImage.alt=item.title;animalImage.onload=()=>visual.classList.add("loaded");animalImage.onerror=()=>visual.classList.remove("loaded");animalImage.src=IMAGE_BY_ID[item.id];'
          fixed = 'animalImage.alt=item.title;animalImage.style.display="block";animalImage.onload=null;animalImage.onerror=()=>{animalImage.style.display="none";};animalImage.src=IMAGE_BY_ID[item.id];'
          if broken not in s:
              raise SystemExit('Expected broken hero-render sequence not found')
          s = s.replace(broken, fixed, 1)

          # Match the approved reference more closely.
          s = s.replace('justify-content:flex-start;gap:8px;', 'justify-content:flex-start;gap:8px;flex-direction:row-reverse;', 1)
          s = s.replace('box-shadow:inset 4px 0 0 #b98bf5', 'box-shadow:none', 1)
          s = s.replace('border:1px solid #e4d7f8;', 'border:1px solid #eadff8;', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit hero fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix hero image rendering against approved reference"
            git push
          fi
