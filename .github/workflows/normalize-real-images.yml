name: Apply approved reference layout

on:
  push:
    paths:
      - '.github/workflows/normalize-real-images.yml'
      - '.github/scripts/apply_reference.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixed reference geometry
        run: python .github/scripts/apply_reference.py
      - name: Repair runtime JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          draw = r'''function draw(){
            let available=pool.filter(x=>!seen.includes(x.id));
            if(!available.length){seen=[];available=pool.slice();}
            const item=available[Math.floor(Math.random()*available.length)];
            seen.push(item.id);save();
            fact.textContent=item.fact;
            punch.textContent=item.punch.replace(/[<>]/g,"").replace(/\n{2,}/g,"\n");
            requestAnimationFrame(fitCurrent);
            animalImage.alt=item.title;
            animalImage.style.display="block";
            animalImage.onload=null;
            animalImage.onerror=()=>{animalImage.style.display="none";};
            animalImage.src=IMAGE_BY_ID[item.id];
            card.classList.remove("fresh");void card.offsetWidth;card.classList.add("fresh");
          }'''
          pattern = r'function draw\(\)\{.*?\}\s*next\.addEventListener'
          s = re.sub(pattern, lambda m: draw + "\n next.addEventListener", s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Restore working greeting runtime"
            git push
          fi
