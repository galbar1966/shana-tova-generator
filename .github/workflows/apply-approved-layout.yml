name: Apply approved greeting layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-approved-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved reference layout
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          style=r'''<style>
          *{box-sizing:border-box}
          html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
          body{background:#edf0f8;color:#17172a;overflow-x:hidden}
          .shell{width:min(100%,680px);margin:0 auto;min-height:100vh;background:#fff;overflow:hidden;box-shadow:0 16px 55px rgba(31,28,75,.12)}
          .card{position:relative;background:#fff;overflow:hidden}
          .hero{position:relative;height:760px;background:#dfe1ea;overflow:hidden}
          .hero img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;opacity:1;transition:opacity .22s ease}
          .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 62%,rgba(17,18,42,.06) 100%);pointer-events:none}
          .fact-card{position:absolute;top:62px;right:34px;width:44%;max-width:300px;z-index:5;background:rgba(255,255,255,.97);border-radius:27px;padding:29px 26px 28px;box-shadow:0 18px 42px rgba(28,25,66,.16)}
          .lead{display:flex;direction:rtl;align-items:center;justify-content:flex-start;gap:10px;color:#6b28d8;font-size:32px;font-weight:900;line-height:1.02;margin:0 0 25px;white-space:nowrap}
          .bulb{font-size:34px;line-height:1;flex:none}
          .fact{font-size:20px;line-height:1.5;font-weight:700;white-space:pre-line;color:#22233b;text-align:right}
          .lower{position:relative;z-index:7;margin:-82px 44px 0;background:#fff;border-radius:30px 30px 0 0;padding:24px 18px 20px;box-shadow:0 -10px 32px rgba(31,28,75,.11)}
          .dots{font-size:18px;line-height:.95;font-weight:900;color:#7a32e8;text-align:center;margin:0 0 18px}
          .punch{font-size:19px;line-height:1.55;font-weight:700;white-space:pre-line;text-align:center;color:#24243d;background:linear-gradient(135deg,#f8f3ff,#f1e9fd);border:1px solid #e4d5f8;border-radius:23px;padding:24px 25px;box-shadow:inset 4px 0 0 #b586f3}
          .divider{display:flex;align-items:center;gap:14px;margin:22px 28px 15px;color:#9698aa}
          .divider:before,.divider:after{content:"";height:1px;background:#d9dae4;flex:1}
          .divider span{font-size:25px;line-height:1;color:#8e90a5}
          .ending{text-align:center;color:#76788c;font-size:17px;line-height:1.5;font-weight:700;padding:0 12px 5px}
          .btn{display:block;width:calc(100% - 88px);margin:18px 44px 24px;border:0;border-radius:25px;padding:18px;background:linear-gradient(135deg,#7d35ef,#6020c9);color:#fff;font:900 20px/1.08 Arial,sans-serif;cursor:pointer;box-shadow:0 14px 30px rgba(98,32,202,.29)}
          .ltr{direction:ltr;display:inline-block}
          .brand{background:linear-gradient(145deg,#20204f,#292b62);color:#fff;text-align:center;padding:34px 16px 38px;border-radius:52% 52% 0 0 / 10% 10% 0 0}
          .brand-name{direction:ltr;color:#9846ed;font-size:40px;font-weight:900;letter-spacing:-1.4px;line-height:1;margin-bottom:10px}
          .brand-line{font-size:14px;line-height:1.45;font-weight:700;color:#f2f1f8}
          .brand-joke{font-size:12px;line-height:1.45;margin-top:5px;color:#d5d2df}
          .brand-joke em{font-style:italic;font-weight:900;color:#fff}
          .error{margin:24px;background:#fff;border-radius:24px;padding:30px 22px;text-align:center;font-size:18px;line-height:1.55}
          @media(max-width:520px){
            body{background:#fff}
            .shell{width:100%;box-shadow:none}
            .hero{height:72vh;min-height:570px;max-height:720px}
            .fact-card{top:40px;right:18px;width:47%;padding:23px 18px 22px;border-radius:23px}
            .lead{font-size:27px;margin-bottom:20px;gap:7px}
            .bulb{font-size:29px}
            .fact{font-size:17px;line-height:1.46}
            .lower{margin:-64px 18px 0;padding:20px 14px 18px;border-radius:27px 27px 0 0}
            .punch{font-size:17.5px;line-height:1.5;padding:21px 17px}
            .ending{font-size:16px}
            .btn{width:calc(100% - 36px);margin:16px 18px 22px;font-size:19px;padding:17px;border-radius:22px}
            .brand{padding:31px 14px calc(34px + env(safe-area-inset-bottom));border-radius:50% 50% 0 0 / 8% 8% 0 0}
            .brand-name{font-size:36px}
          }
          @media(max-width:380px){
            .hero{min-height:540px}
            .fact-card{right:14px;top:30px;width:49%;padding:20px 15px}
            .lead{font-size:24px}
            .bulb{font-size:26px}
            .fact{font-size:15.8px}
            .lower{margin-left:12px;margin-right:12px}
            .punch{font-size:16.5px}
            .btn{width:calc(100% - 24px);margin-left:12px;margin-right:12px}
          }
          </style>'''
          s=re.sub(r'<style>.*?</style>',style,s,flags=re.S)
          p.write_text(s,encoding='utf-8')
      - name: Commit approved layout
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Lock approved greeting card proportions"
          git pull --rebase origin main
          git push origin main