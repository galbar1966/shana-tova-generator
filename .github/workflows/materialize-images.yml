name: Materialize staged animal sprites
on:
  push:
    branches: [main]
    paths:
      - 'assets/animals/*.base64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode staged sprites
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(assets/animals/*.base64)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No staged sprites"
            exit 0
          fi
          for src in "${files[@]}"; do
            dst="${src%.base64}.webp"
            base64 --decode "$src" > "$dst"
            rm "$src"
          done
      - name: Commit materialized sprites
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animals
          git commit -m "Materialize animal image sprites"
          git pull --rebase origin main
          git push origin main
