name: Apply site restyle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved UI restyle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}body{background:linear-gradient(160deg,#fff7e7 0%,#f8e8df 48%,#f5d9dc 100%);color:#241814;display:flex;justify-content:center;padding:22px 14px 34px}.wrap{width:min(100%,560px);display:flex;flex-direction:column;gap:14px}.card{position:relative;overflow:hidden;background:rgba(255,255,255,.94);border:1px solid rgba(128,63,48,.13);border-radius:28px;padding:28px 25px 24px;box-shadow:0 18px 45px rgba(104,55,42,.13)}.card:before{content:"🍎";position:absolute;left:-13px;top:-16px;font-size:58px;transform:rotate(-16deg);opacity:.12}.card:after{content:"🍯";position:absolute;right:-11px;bottom:-15px;font-size:54px;transform:rotate(12deg);opacity:.11}.lead{position:relative;font-size:28px;font-weight:700;margin:0 0 22px;color:#7f2533}.fact,.punch,.ending{position:relative;white-space:pre-line}.fact{font-size:21px;line-height:1.55;font-weight:700}.dots{position:relative;font-size:18px;line-height:1.05;margin:17px 0 15px;color:#a54a58;font-weight:700}.punch{font-size:20px;line-height:1.52;font-weight:500;margin:0 0 26px}.ending{border-top:1px solid rgba(127,37,51,.16);padding-top:18px;font-size:19px;line-height:1.5;font-weight:700;color:#7f2533}.btn{width:100%;border:0;border-radius:20px;background:linear-gradient(135deg,#8f2939,#bd4552);color:#fff;font-family:Arial,sans-serif;font-size:20px;font-weight:700;line-height:1.12;padding:16px 18px;cursor:pointer;box-shadow:0 9px 20px rgba(127,37,51,.24);transition:transform .12s ease,box-shadow .12s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 11px 24px rgba(127,37,51,.28)}.btn:active{transform:translateY(1px)}.error{font-size:19px;line-height:1.55;text-align:center;padding:50px 8px}.ltr{direction:ltr;display:inline-block}@media(max-width:420px){body{padding:12px 10px 24px}.wrap{gap:12px}.card{border-radius:24px;padding:24px 20px 21px}.lead{font-size:26px;margin-bottom:18px}.fact{font-size:20px}.punch{font-size:19px}.ending{font-size:18px}.btn{font-size:19px;border-radius:18px;padding:15px 16px}}'''
          s=re.sub(r'<style>.*?</style>', '<style>\n'+css+'\n</style>', s, count=1, flags=re.S)
          s=s.replace('<div class="counter" id="counter"></div>','')
          s=s.replace(", counter=document.getElementById('counter')",'')
          s=s.replace(";counter.textContent=''",'')
          s=re.sub(r';?counter\.textContent=`\$\{seen\.length\} מתוך \$\{pool\.length\} בסבב הנוכחי`','',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit restyle if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restyle greeting card UI"
          git push
